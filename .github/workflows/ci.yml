name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unix:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.11', '3.12', '3.13', '3.14']
    env:
      MISSION_REQUIRE_SHELLS: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install zsh
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y zsh
      - name: Unit tests
        run: python3 -m unittest discover -s tests
      - name: Behavioral probes
        run: |
          python3 evals/run_behavioral.py --baseline evals/baseline-control-plane-v031.json
          python3 -O evals/run_behavioral.py --baseline evals/baseline-control-plane-v031.json
      - name: Template and packaging
        run: |
          python3 scripts/mission.py validate --contract templates/contract.json
          python3 scripts/package_release.py --output "$RUNNER_TEMP/mission-control.zip"

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Shell checks
        run: |
          bash -n scripts/verify.sh scripts/no_progress.sh
          shellcheck scripts/*.sh

  wsl:
    name: WSL Ubuntu
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: wsl-bash {0}
    env:
      MISSION_REQUIRE_SHELLS: '1'
      WSLENV: MISSION_REQUIRE_SHELLS
    steps:
      - uses: actions/checkout@v7
      - uses: Vampire/setup-wsl@v7
        with:
          distribution: Ubuntu-24.04
          additional-packages: python3 zsh git
      - name: Unit tests on the Linux filesystem
        run: |
          git config --global --add safe.directory '*'
          rm -rf "$HOME/mission-control"
          cp -r . "$HOME/mission-control"
          cd "$HOME/mission-control"
          python3 --version
          python3 -m unittest discover -s tests
          python3 evals/run_behavioral.py --baseline evals/baseline-control-plane-v031.json
      - name: Unit tests on a mounted Windows drive (informational)
        continue-on-error: true
        run: |
          git config --global --add safe.directory '*'
          pwd
          python3 -m unittest discover -s tests 2>&1 | tail -40
          exit "${PIPESTATUS[0]}"
